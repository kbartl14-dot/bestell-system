<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
        .success-animation { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fillProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        .animate-progress-2s {
            animation: fillProgress 2s linear forwards;
        }
        .teewagen-hinweis {
            background: #fef3c7;
            border: 2px solid #f59e0b;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: bold;
            color: #92400e;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .teewagen-hinweis span {
            font-size: 18px;
        }
        .grid-trocken {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .grid-normal {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        @media (max-width: 640px) {
            .grid-trocken, .grid-normal {
                grid-template-columns: 1fr;
            }
        }
        .item-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            transition: all 0.15s;
            gap: 4px;
            min-height: 44px;
        }
        .item-card:hover {
            border-color: #94a3b8;
            background: #f1f5f9;
        }
        .item-card.has-value {
            background: #eff6ff;
            border-color: #3b82f6;
        }
        .item-card .item-info {
            flex: 1;
            min-width: 0;
            text-align: left;
        }
        .item-card .item-name {
            font-weight: 700;
            font-size: 11px;
            color: #0f172a;
            line-height: 1.2;
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .item-card .item-unit {
            font-size: 7px;
            font-weight: 800;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            display: block;
            line-height: 1.2;
        }
        .item-card .item-input {
            width: 36px;
            background: white;
            border: 1.5px solid #e2e8f0;
            padding: 3px 2px;
            text-align: center;
            font-weight: 800;
            border-radius: 6px;
            font-size: 11px;
            outline: none;
            flex-shrink: 0;
            transition: border-color 0.15s;
        }
        .item-card .item-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }
        .item-card.has-value .item-input {
            border-color: #3b82f6;
            background: #ffffff;
        }
        .bg-slate-100 { background-color: #f1f5f9; }
        .min-h-screen { min-height: 100vh; }
        .text-slate-900 { color: #0f172a; }
        .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>

        const HOUSES_CONFIG = [

            ]},
            { id: 'milchsep', name: 'Milch separat', icon: '🥛', spalten: 2, nur_an_werktagen: true, items: [
                { name: 'Milch 1L (Karton)', unit: 'Karton' }
            ]},
            { id: 'nonfood', name: 'Non-Food', icon: '🧴', spalten: 2, nur_an_werktagen: true, items: [
                { name: 'Spülmittel', unit: 'Flasche' },
                { name: 'Klarspülmittel', unit: 'Flasche' },
                { name: 'Spülmaschinentabs', unit: 'Packung' },
                { name: 'Küchenrolle', unit: '4er Gebinde' },
                { name: 'WC Papier', unit: '12er Gebinde' },
                { name: 'Müllbeutel 30l', unit: 'Rolle' },
                { name: 'Müllbeutel 60l', unit: 'Rolle' },
                { name: 'bl. Säcke', unit: 'Rolle' }
            ]}
        ];

        const isWeekend = (dateStr) => {
            const date = new Date(dateStr);
            const day = date.getDay();
            return day === 0 || day === 6;
        };

        const isHoliday = (dateStr) => {
            return ALL_HOLIDAYS.includes(dateStr);
        };

        const isWorkingDay = (dateStr) => {
            return !isWeekend(dateStr) && !isHoliday(dateStr);
        };

        const getDayType = (dateStr) => {
            if (isHoliday(dateStr)) return 'Feiertag';
            if (isWeekend(dateStr)) return 'Wochenende';
            return 'Werktag';
        };

        function App() {
            const [house, setHouse] = useState('');
            const [group, setGroup] = useState('');
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [activeCatId, setActiveCatId] = useState(CATEGORIES[0].id);
            const [qties, setQties] = useState({});
            const [notes, setNotes] = useState('');
            const [orderedBy, setOrderedBy] = useState('');
            const [passwort, setPasswort] = useState('');
            const [isSending, setIsSending] = useState(false);
            const [showSuccess, setShowSuccess] = useState(false);
            const [showLateWarning, setShowLateWarning] = useState(false);

            const isDateWorkingDay = useMemo(() => {
                return isWorkingDay(date);
            }, [date]);

            const dayType = useMemo(() => {
                return getDayType(date);
            }, [date]);

            const availableCategories = useMemo(() => {
                return CATEGORIES.map(cat => ({
                    ...cat,
                    isDisabled: cat.nur_an_werktagen && !isDateWorkingDay
                }));
            }, [isDateWorkingDay]);

            useEffect(() => {
                const activeCat = availableCategories.find(c => c.id === activeCatId);
                if (activeCat && activeCat.isDisabled) {
                    const firstAvailable = availableCategories.find(c => !c.isDisabled);
                    if (firstAvailable) {
                        setActiveCatId(firstAvailable.id);
                    }
                }
            }, [availableCategories, activeCatId]);

            const groups = useMemo(() => {
                if (house === 'Werk 1' || house === 'Werk 2') return ['Rot', 'Gelb', 'Grün', 'Blau'];
                return [];
            }, [house]);

            const hasGroups = groups.length > 0;

            useEffect(() => { setGroup(''); }, [house]);

            const activeCategory = availableCategories.find(c => c.id === activeCatId);

            const getOrderedItems = () => {
                let list = [];
                CATEGORIES.forEach(cat => {
                    const isDisabled = cat.nur_an_werktagen && !isDateWorkingDay;
                    if (isDisabled) return;
                    
                    let items = cat.items.filter(i => qties[i.name]).map(i => ({ ...i, qty: qties[i.name], catName: cat.name, catIcon: cat.icon }));
                    if (items.length > 0) list.push({ name: cat.name, icon: cat.icon, items });
                });
                return list;
            };

            const handleOrderedByChange = (e) => {
                const val = e.target.value.replace(/[^a-zA-ZäöüÄÖÜß\s-]/g, '');
                setOrderedBy(val);
            };

            const handleNumberKeyDown = (e) => {
                if (['e', 'E', '+', '-', ',', '.'].includes(e.key)) e.preventDefault();
            };

            const isAfterDeadline = () => {
                if (FORCE_DEADLINE_STATE !== null) {
                    return FORCE_DEADLINE_STATE;
                }
                
                const today = new Date().toISOString().split('T')[0];
                if (date !== today) {
                    return false;
                }
                
                const now = new Date();
                const hours = now.getHours();
                const minutes = now.getMinutes();
                return hours > 9 || (hours === 9 && minutes > 0);
            };

            const hasDisabledCategoryItems = () => {
                for (let cat of CATEGORIES) {
                    if (cat.nur_an_werktagen && !isDateWorkingDay) {
                        const hasItems = cat.items.some(i => qties[i.name]);
                        if (hasItems) return true;
                    }
                }
                return false;
            };

            const handleSubmit = async (e) => {
                e.preventDefault();

                if (hasDisabledCategoryItems()) {
                    alert('⛔ An Sonn-, Feiertagen und Wochenenden können keine Artikel aus Trockensortiment, Non-Food und Milch separat bestellt werden!');
                    return;
                }

                const deadlineExceeded = isAfterDeadline();
                
                if (deadlineExceeded) {
                    setShowLateWarning(true);
                    return;
                }

                setIsSending(true);

                const itemsByCat = getOrderedItems();
                const houseInfo = HOUSES_CONFIG.find(h => h.name === house);
                const houseEmail = houseInfo ? houseInfo.email : '';

                // Bestätigungstext für das Haus
                let bestaetigungText = '📋 BESTELLBESTÄTIGUNG\n';
                bestaetigungText += '═══════════════════════════════════════\n\n';
                bestaetigungText += '🏠 Haus: ' + house + '\n';
                if (hasGroups) bestaetigungText += '👥 Gruppe: ' + group + '\n';
                bestaetigungText += '📅 Datum: ' + new Date(date).toLocaleDateString('de-DE') + ' (' + dayType + ')\n';
                bestaetigungText += '👤 Besteller/in: ' + orderedBy + '\n\n';
                
                if (!isDateWorkingDay) {
                    bestaetigungText += '📅 HINWEIS: Heute ist ' + dayType + '.\n';
                    bestaetigungText += '✅ Nur frische Lebensmittel (Brot, Molkerei, Frischetheke, Frische) wurden bestellt.\n';
                    bestaetigungText += '⛔ Trockensortiment, Non-Food und Milch separat sind heute NICHT bestellbar.\n\n';
                }
                
                bestaetigungText += '─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─\n\n';
                
                itemsByCat.forEach(cat => {
                    bestaetigungText += cat.icon + ' ' + cat.name.toUpperCase() + '\n';
                    cat.items.forEach(i => {
                        bestaetigungText += '  • ' + i.name + ': ' + i.qty + ' ' + i.unit + '\n';
                    });
                    bestaetigungText += '\n';
                });
                
                if (notes) {
                    bestaetigungText += '─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─\n';
                    bestaetigungText += '💬 ANMERKUNGEN:\n' + notes + '\n\n';
                }
                
                bestaetigungText += '═══════════════════════════════════════\n';
                bestaetigungText += 'Vielen Dank für Ihre Bestellung! 🍳';

                // ===== PAYLOAD für Google Sheets =====
                const payload = {
                    action: 'neue_bestellung',
                    haus: house,
                    haus_email: houseEmail,
                    gruppe: hasGroups ? group : '',
                    datum: new Date(date).toLocaleDateString('de-DE'),
                    tagestyp: dayType,
                    ist_werktag: isDateWorkingDay,
                    besteller: orderedBy,
                    anmerkungen: notes + (!isDateWorkingDay ? ' 📅 HINWEIS: Heute ist ' + dayType + '. Nur frische Lebensmittel wurden bestellt.' : ''),
                    passwort: passwort,
                    bestellte_artikel: itemsByCat
                };

                try {
                    const response = await fetch(GAS_API_URL, {
                        method: 'POST',
                        // text/plain (statt application/json) = KEIN CORS-Preflight!
                        // Google Apps Script liest den JSON-Body trotzdem korrekt.
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });

                    const result = await response.json();

                    if (result.success) {
                        setTimeout(() => {
                            setIsSending(false);
                            setShowSuccess(true);
                        }, 2000);
                    } else {
                        alert('❌ Fehler: ' + (result.error || 'Unbekannter Fehler'));
                        setIsSending(false);
                    }
                } catch (error) {
                    alert('❌ Netzwerkfehler: ' + error.message);
                    setIsSending(false);
                }
            };

            // ===== RENDER =====
            if (isSending) {
                return (
                    <div className="min-h-screen p-4 sm:p-8 flex flex-col items-center justify-center success-animation text-center">
                        <div className="bg-white rounded-3xl shadow-xl p-8 w-full max-w-md border border-slate-100 space-y-5">
                            <div className="w-full max-w-xs mx-auto space-y-3 py-2">
                                <div className="flex justify-between items-center text-[11px] font-bold text-slate-500 px-1">
                                    <span>🏠 {house || 'Haus'}</span>
                                    <span className="text-blue-600 font-black uppercase tracking-wider animate-pulse">
                                        Wird übermittelt...
                                    </span>
                                    <span>🍳 Küche</span>
                                </div>
                                <div className="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden relative border border-slate-200/80 shadow-inner">
                                    <div className="h-full bg-blue-600 rounded-full animate-progress-2s shadow-sm"></div>
                                </div>
                            </div>
                            <p className="text-xs text-slate-400 font-bold uppercase tracking-wider">Bitte einen Moment Geduld...</p>
                        </div>
                    </div>
                );
            }

            if (showSuccess) {
                return (
                    <div className="min-h-screen p-4 sm:p-8 flex flex-col items-center justify-center success-animation text-center">
                        <div className="bg-white rounded-3xl shadow-xl p-8 w-full max-w-md border border-slate-100 space-y-6">
                            <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-3xl font-black shadow-inner">
                                ✓
                            </div>
                            <h2 className="text-2xl font-black text-slate-800">Vielen Dank!</h2>
                            <div className="space-y-1 text-slate-600 font-medium text-sm">
                                <p>Deine Bestellung für <span className="font-bold text-slate-800">{house}</span> wurde erfolgreich an die Küche übermittelt.</p>
                                <p className="text-slate-500 font-semibold pt-2">Eine Übersicht wurde dir per E-Mail gesendet.</p>
                            </div>
                            <div className="pt-2">
                                <button
                                    type="button"
                                    onClick={() => window.close()}
                                    className="w-full bg-slate-900 text-white py-3.5 rounded-xl font-black text-xs uppercase tracking-wider hover:bg-slate-800 active:scale-95 transition-all shadow-md">
                                    Fenster schließen
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (showLateWarning) {
                return (
                    <div className="min-h-screen p-4 sm:p-8 flex flex-col items-center justify-center success-animation text-center">
                        <div className="bg-white rounded-3xl shadow-xl p-8 w-full max-w-md border border-red-200 space-y-6">
                            <div className="w-20 h-20 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto text-5xl shadow-inner">
                                ⏰
                            </div>
                            <h2 className="text-2xl font-black text-red-700">Bestellschluss überschritten!</h2>
                            <div className="space-y-3 text-slate-600 font-medium text-sm">
                                <p className="bg-red-50 p-4 rounded-xl border border-red-200 text-slate-700">
                                    Leider können wir heute deine Bestellung nicht mehr entgegen nehmen.
                                </p>
                                <p className="text-slate-700">
                                    Bitte wende dich telefonisch an die Küche oder gib eine neue Bestellung für den Folgetag auf.
                                </p>
                                <p className="text-slate-500 text-xs pt-1 font-semibold">
                                    Vielen Dank für dein Verständnis.
                                </p>
                            </div>
                            <div className="pt-2">
                                <button
                                    type="button"
                                    onClick={() => window.close()}
                                    className="w-full bg-red-600 text-white py-3.5 rounded-xl font-black text-xs uppercase tracking-wider hover:bg-red-700 active:scale-95 transition-all shadow-md">
                                    Fenster schließen
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="pb-32 text-left">
                    <header className="bg-white p-5 shadow-sm border-b border-slate-200 sticky top-0 z-50 text-center">
                        <div className="container mx-auto flex flex-col items-center">
                            <h1 className="text-xl font-black tracking-tight text-slate-900 uppercase italic">Küchenbestellung</h1>
                            <p className="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em] mt-0.5">Lippischer Blinden und Sehbehindertenverein</p>
                        </div>
                    </header>

                    <main className="container mx-auto p-4 max-w-6xl mt-2">
                        <form onSubmit={handleSubmit}>
                            <div className="grid grid-cols-1 lg:grid-cols-4 gap-5 items-start">

                                <div className="lg:col-span-1 space-y-3 lg:sticky lg:top-20">
                                    <section className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-3.5">
                                        <h2 className="text-[11px] font-black uppercase tracking-widest text-slate-400 border-b border-slate-100 pb-2">Bestell-Details</h2>

                                        <div className="space-y-1">
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1">Haus auswählen</label>
                                            <select required className="w-full bg-slate-50 p-3 rounded-xl border-none outline-none font-bold text-slate-700 text-xs appearance-none transition-all focus:bg-white focus:ring-2 focus:ring-blue-500"
                                                    value={house} onChange={e => setHouse(e.target.value)}>
                                                <option value="">Bitte wählen...</option>
                                                {HOUSES_CONFIG.map(h => <option key={h.name} value={h.name}>{h.name}</option>)}
                                            </select>
                                        </div>

                                        {house && (
                                            <div className="bg-amber-50 border border-amber-200 text-amber-800 px-3 py-2 rounded-xl text-xs font-black text-center animate-fadeIn shadow-sm">
                                                ⚠️ Bestellung bis 9 Uhr !!!
                                            </div>
                                        )}

                                        {hasGroups && (
                                            <div className="space-y-1">
                                                <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1">Gruppe</label>
                                                <select required className="w-full bg-slate-50 p-3 rounded-xl border-none outline-none font-bold text-slate-700 text-xs appearance-none transition-all focus:bg-white focus:ring-2 focus:ring-blue-500"
                                                        value={group} onChange={e => setGroup(e.target.value)}>
                                                    <option value="">Wählen...</option>
                                                    {groups.map(g => <option key={g} value={g}>{g}</option>)}
                                                </select>
                                            </div>
                                        )}

                                        <div className="space-y-1">
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1">Lieferdatum</label>
                                            <input type="date" className="w-full bg-slate-50 p-3 rounded-xl border-none outline-none font-bold text-slate-700 text-xs focus:bg-white focus:ring-2 focus:ring-blue-500" value={date} onChange={e => setDate(e.target.value)} />
                                        </div>

                                        <div className="space-y-1">
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1">Anmerkungen</label>
                                            <textarea placeholder="Zusätzliche Wünsche..." className="w-full bg-slate-50 p-3 rounded-xl border-none outline-none focus:ring-2 focus:ring-blue-500 min-h-[70px] text-xs" value={notes} onChange={e => setNotes(e.target.value)} />
                                        </div>

                                        <div className="space-y-1">
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1 block">Besteller/in</label>
                                            <input required type="text" placeholder="Dein Name" className="w-full bg-slate-50 p-3 rounded-xl border-none outline-none focus:ring-2 focus:ring-blue-500 font-bold text-xs" value={orderedBy} onChange={handleOrderedByChange} />
                                        </div>

                                        <div className="space-y-1">
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1 block">Bestellwort</label>
                                            <input required type="password" placeholder="Geheimes Bestellwort eingeben" className="w-full bg-slate-50 p-3 rounded-xl border-none outline-none focus:ring-2 focus:ring-blue-500 font-bold text-xs" value={passwort} onChange={e => setPasswort(e.target.value)} />
                                        </div>
                                    </section>
                                </div>

                                <div className="lg:col-span-3 grid grid-cols-1 md:grid-cols-3 gap-4 items-start">

                                    <div className="md:col-span-1 bg-white rounded-2xl p-3 shadow-sm border border-slate-200 space-y-1.5 md:sticky md:top-20">
                                        <h2 className="text-[10px] font-black uppercase tracking-widest text-slate-400 px-2 py-1 border-b border-slate-100">Kategorien</h2>
                                        <div className="space-y-1 pt-1">
                                            {availableCategories.map(cat => {
                                                const isActive = activeCatId === cat.id;
                                                const selectedCount = cat.items.filter(i => qties[i.name]).length;
                                                const isDisabled = cat.isDisabled;
                                                
                                                return (
                                                    <button 
                                                        key={cat.id} 
                                                        type="button" 
                                                        onClick={() => !isDisabled && setActiveCatId(cat.id)}
                                                        disabled={isDisabled}
                                                        className={'w-full flex items-center justify-between px-3 py-2.5 rounded-xl transition-all text-left ' +
                                                            (isDisabled 
                                                                ? 'bg-slate-100 text-slate-400 cursor-not-allowed opacity-60' 
                                                                : isActive 
                                                                    ? 'bg-slate-900 text-white shadow-md' 
                                                                    : 'bg-slate-50 hover:bg-slate-100 text-slate-700')}
                                                    >
                                                        <div className="flex items-center gap-2.5 truncate">
                                                            <span className="text-base">{cat.icon}</span>
                                                            <span className="text-xs font-bold truncate">{cat.name}</span>
                                                            {isDisabled && <span className="text-[8px] text-red-500 font-black">⛔</span>}
                                                        </div>
                                                        {selectedCount > 0 && !isDisabled && (
                                                            <span className={'text-[9px] px-1.5 py-0.2 rounded-full font-black ' + (isActive ? 'bg-blue-500 text-white' : 'bg-blue-600 text-white')}>
                                                                {selectedCount}
                                                            </span>
                                                        )}
                                                    </button>
                                                );
                                            })}
                                        </div>

                                        <div className="teewagen-hinweis">
                                            <span>🧹</span>
                                            Teewagen bitte sauber hinterlassen!!!
                                            <span>🧹</span>
                                        </div>

                                        {!isDateWorkingDay && (
                                            <div className="mt-2 p-2 bg-red-50 border border-red-200 rounded-lg text-[10px] font-bold text-red-600 text-center">
                                                ⛔ Feiertage, Sa. &amp; So. nicht bestellbar!
                                            </div>
                                        )}
                                    </div>

                                    <div className="md:col-span-2 bg-white rounded-2xl p-4 shadow-sm border border-slate-200 min-h-[300px]">
                                        {activeCategory ? (
                                            <div>
                                                <div className="flex items-center gap-2 border-b border-slate-100 pb-3 mb-3">
                                                    <span className="text-xl">{activeCategory.icon}</span>
                                                    <h2 className="text-sm font-black text-slate-800 uppercase tracking-wide">{activeCategory.name}</h2>
                                                    {activeCategory.isDisabled && (
                                                        <span className="ml-auto text-[10px] font-black text-red-600 bg-red-50 px-2 py-1 rounded-lg border border-red-200">
                                                            ⛔ Heute nicht bestellbar
                                                        </span>
                                                    )}
                                                </div>
                                                {activeCategory.isDisabled ? (
                                                    <div className="flex flex-col items-center justify-center py-12 text-slate-400">
                                                        <span className="text-4xl mb-3">⛔</span>
                                                        <p className="text-sm font-bold text-slate-500">Diese Kategorie ist heute nicht bestellbar</p>
                                                        <p className="text-xs text-slate-400 mt-1">An Sonn-, Feiertagen und Wochenenden gesperrt</p>
                                                    </div>
                                                ) : (
                                                    <div className={activeCategory.spalten === 3 ? 'grid-trocken' : 'grid-normal'}>
                                                        {activeCategory.items.map(item => {
                                                            const val = qties[item.name];
                                                            return (
                                                                <div key={item.name} className={'item-card ' + (val ? 'has-value' : '')}>
                                                                    <div className="item-info">
                                                                        <span className="item-name">{item.name}</span>
                                                                        <span className="item-unit">{item.unit}</span>
                                                                    </div>
                                                                    <input 
                                                                        type="number" 
                                                                        min="1" 
                                                                        step="1" 
                                                                        onKeyDown={handleNumberKeyDown}
                                                                        className="item-input"
                                                                        value={val || ''} 
                                                                        onChange={e => {
                                                                            const rawVal = e.target.value.replace(/[^0-9]/g, '');
                                                                            const v = parseInt(rawVal, 10);
                                                                            const n = {...qties};
                                                                            if (isNaN(v) || v <= 0) delete n[item.name]; 
                                                                            else n[item.name] = v;
                                                                            setQties(n);
                                                                        }} 
                                                                    />
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                )}
                                            </div>
                                        ) : (
                                            <div className="flex flex-col items-center justify-center h-full text-slate-400 py-12">
                                                <p className="text-xs font-bold">Bitte links eine Kategorie auswählen</p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>

                            <div className="fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur-xl border-t border-slate-200 p-3 shadow-[0_-10px_40px_rgba(0,0,0,0.1)] z-50">
                                <div className="container mx-auto flex gap-3 max-w-xl">
                                    <button type="submit" disabled={!Object.keys(qties).length || !house || (hasGroups && !group) || !orderedBy.trim() || !passwort.trim() || isSending}
                                            className={'w-full bg-blue-600 text-white py-4 rounded-xl font-black text-sm shadow-lg flex items-center justify-center gap-2 transition-all ' + (isSending ? 'opacity-50' : 'hover:bg-blue-700 active:scale-95') + ' disabled:opacity-40 disabled:cursor-not-allowed'}>
                                        BESTELLUNG ABSCHICKEN
                                    </button>
                                </div>
                            </div>
                        </form>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
